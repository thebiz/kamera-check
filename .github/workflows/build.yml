name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: gradle :app:assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk kamera-check.apk

      - name: Forschungsdokument als lesbare Seite
        run: |
          python3 -m pip install --quiet --break-system-packages markdown
          python3 tools/md2html.py docs/FORSCHUNG.md Forschung.html

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kamera-Check ${{ github.run_number }}
          body: "Wie alles funktioniert und was wir gelernt haben: Forschung.html (unten bei den Dateien)."
          files: |
            kamera-check.apk
            Forschung.html
