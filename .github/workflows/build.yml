name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: gradle :app:assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk kamera-check.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kamera-Check ${{ github.run_number }}
          files: kamera-check.apk
